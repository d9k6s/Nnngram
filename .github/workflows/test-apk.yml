name: Build Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-apk.yml'
      - 'TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java'
      - 'TMessagesProj/src/main/java/xyz/nextalone/nnngram/activity/GeneralSettingActivity.java'
      - 'TMessagesProj/src/main/java/xyz/nextalone/nnngram/helpers/TranslateHelper.kt'
      - 'TMessagesProj/src/main/java/xyz/nextalone/nnngram/translate/BaseTranslator.kt'
      - 'TMessagesProj/src/main/java/xyz/nextalone/nnngram/translate/providers/DeepLxTextProcessor.kt'
      - 'TMessagesProj/src/main/java/xyz/nextalone/nnngram/translate/providers/DeepLxranslator.kt'
      - 'TMessagesProj/src/main/java/xyz/nextalone/nnngram/utils/Defines.kt'
      - 'TMessagesProj/src/main/res/values/strings_nullgram.xml'
      - 'TMessagesProj/src/main/res/values-*/strings_nullgram.xml'

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out submodules
        run: git -c submodule."libs/rust".update=none submodule update --init --recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-test
          restore-keys: ccache-test

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Prepare unsigned debug build
        run: |
          sed -i '/signingConfig =/d' TMessagesProj/build.gradle.kts
          sed -i '/google.services/d' TMessagesProj/build.gradle.kts
          sed -i '/google.services/d' build.gradle.kts

      - name: Build test APK
        run: ./gradlew :TMessagesProj:assembleDebug --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Nnngram-test-${{ github.run_number }}-${{ github.sha }}
          path: TMessagesProj/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 14
